{% extends "base.html" %}

{% block title %}Server Error (500) - Smart CivicCare{% endblock %}

{% block content %}
<div class="container py-5 text-center">
  <div class="py-5">
    <div class="kpi-icon-bubble mx-auto mb-3" style="width: 72px; height: 72px; font-size: 2.2rem; background: #fee2e2; color: #ef4444;">
      <i class="bi bi-exclamation-triangle-fill"></i>
    </div>
    <h1 class="display-5 fw-bold text-navy-dark">500 - Internal Server Error</h1>
    <p class="lead text-muted mb-4">An unexpected error occurred while processing this smart city municipal request.</p>
    <a href="{{ url_for('index') }}" class="btn btn-civic-teal px-4 py-2">
      <i class="bi bi-house-door me-1"></i>Return to Home
    </a>
  </div>
</div>
{% endblock %}
